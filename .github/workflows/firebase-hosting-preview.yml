# Deploy and clean up Firebase Hosting preview channels for PRs.
# Same-repo PRs only. Dependabot/forks skip cleanly when secrets are unavailable.
name: Deploy to Firebase Hosting (Preview)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build_and_preview:
    name: build_and_preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # GitHub Actions does not allow secrets.* directly in if: expressions.
      - name: Prepare Firebase service account (optional)
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OUT: ${{ runner.temp }}/firebase-sa.json
        run: |
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            echo "has_sa=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase preview deploy: dependabot PR actor."
            exit 0
          fi

          if [ -z "${SA_JSON:-}" ]; then
            echo "has_sa=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase preview deploy: FIREBASE_SERVICE_ACCOUNT secret not available."
            exit 0
          fi

          node -e "require('fs').writeFileSync(process.env.OUT, process.env.SA_JSON)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$OUT" >> "$GITHUB_ENV"
          echo "has_sa=true" >> "$GITHUB_OUTPUT"

      - name: Install firebase-tools
        if: steps.sa.outputs.has_sa == 'true'
        run: npm i -g firebase-tools@15.7.0

      - name: Deploy preview channel (hosting)
        if: steps.sa.outputs.has_sa == 'true'
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --project studio-9091923245-2991d --expires 3d --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  cleanup_preview:
    name: cleanup_preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Prepare Firebase service account (optional)
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OUT: ${{ runner.temp }}/firebase-sa.json
        run: |
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            echo "has_sa=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase preview cleanup: dependabot PR actor."
            exit 0
          fi

          if [ -z "${SA_JSON:-}" ]; then
            echo "has_sa=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Firebase preview cleanup: FIREBASE_SERVICE_ACCOUNT secret not available."
            exit 0
          fi

          node -e "require('fs').writeFileSync(process.env.OUT, process.env.SA_JSON)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$OUT" >> "$GITHUB_ENV"
          echo "has_sa=true" >> "$GITHUB_OUTPUT"

      - name: Install firebase-tools
        if: steps.sa.outputs.has_sa == 'true'
        run: npm i -g firebase-tools@15.7.0

      - name: Delete preview channel (hosting)
        if: steps.sa.outputs.has_sa == 'true'
        run: firebase hosting:channel:delete "pr-${{ github.event.pull_request.number }}" --project studio-9091923245-2991d --force
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
