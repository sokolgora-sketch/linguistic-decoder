name: Deploy to Firebase Hosting (Preview)

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Preview channel id (example: manual-preview)"
        required: true
        default: "manual-preview"
      expires:
        description: "Expiry duration (example: 3d)"
        required: true
        default: "3d"

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Firebase service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OUT: ${{ runner.temp }}/firebase-sa.json
        run: |
          if [ -z "${SA_JSON:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not available."
            exit 1
          fi

          node -e "require('fs').writeFileSync(process.env.OUT, process.env.SA_JSON)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$OUT" >> "$GITHUB_ENV"

      - name: Install firebase-tools
        run: npm i -g firebase-tools@15.7.0

      - name: Deploy preview channel (hosting)
        run: firebase hosting:channel:deploy "${{ github.event.inputs.channel_id }}" --project studio-9091923245-2991d --expires "${{ github.event.inputs.expires }}" --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
