# Deploy a preview channel for PRs (same-repo only).
# Note: Dependabot PRs do NOT receive secrets, so we must skip deploy steps.
name: Deploy to Firebase Hosting (Preview)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    # same-repo PRs only (no forks)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Skip deploy (no secrets for this PR actor)
        if: secrets.FIREBASE_SERVICE_ACCOUNT == '' || github.actor == 'dependabot[bot]'
        run: echo "Skipping Firebase preview deploy: secrets unavailable for this PR actor."

      - name: Write Firebase service account
        if: secrets.FIREBASE_SERVICE_ACCOUNT != '' && github.actor != 'dependabot[bot]'
        run: |
          node -e "require('fs').writeFileSync(process.env.OUT, process.env.SA_JSON)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$OUT" >> "$GITHUB_ENV"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OUT: ${{ runner.temp }}/firebase-sa.json

      - name: Install firebase-tools
        if: secrets.FIREBASE_SERVICE_ACCOUNT != '' && github.actor != 'dependabot[bot]'
        run: npm i -g firebase-tools@15.7.0

      - name: Deploy preview channel (hosting)
        if: secrets.FIREBASE_SERVICE_ACCOUNT != '' && github.actor != 'dependabot[bot]'
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --project studio-9091923245-2991d --expires 7d --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
