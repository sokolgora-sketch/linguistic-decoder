name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core_validation:
    name: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Open Instrument run packet fixture validation
        run: npm run open-instrument:validate-run-packet-fixture

      - name: Verify frozen Open Instrument analytical capability v1 artifacts
        run: |
          echo "80e161d14538875e3cd9225cd6d43b8db2c40f7f68ca2fef661da216430e7d0a  tests/fixtures/openInstrument/analysis-capability-baseline.v1.manifest.json" | sha256sum --check
          echo "1cf20269b3d9516c66b8470b60208699e48e0a3ff78608107054078e91bc6d6d  tests/fixtures/openInstrument/analysis-capability-baseline.v1.json" | sha256sum --check

      - name: Check current-runtime Open Instrument regression baseline reproducibility
        env:
          OPEN_INSTRUMENT_EXTERNAL_SOURCE_ROOT: ""
        run: npm run open-instrument:analysis-capability-regression-baseline -- --check

      - name: Validate Open Instrument provider execution preflight static fixture
        run: npm run open-instrument:validate-provider-execution-preflight-static-fixture

      - name: Audit provider execution preflight mapping coverage
        run: npm run open-instrument:audit-provider-execution-preflight-mapping-coverage

      - name: Test Open Instrument provider execution preflight static fixture validator
        run: npx jest -c jest.config.mjs tests/openInstrument.providerExecutionPreflightStaticFixtureSchemaValidation.v0.1.spec.ts --runInBand

      - name: Test Open Instrument provider execution preflight static fixture validator integration gate
        run: npx jest -c jest.config.mjs tests/openInstrument.providerExecutionPreflightStaticFixtureSchemaValidationIntegrationGate.v0.1.spec.ts --runInBand

      - name: Lint
        run: npm run lint

      - name: Integration
        run: npm run test:integration

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  unit_tests:
    name: unit-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test unit shard
        run: npm test -- --ci --silent --maxWorkers=2 --shard=${{ matrix.shard }}/4

  browser_smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify Playwright version alignment
        run: |
          node <<'NODE'
          const version = require("playwright/package.json").version;
          if (version !== "1.63.0") {
            console.error(`Expected Playwright 1.63.0, found ${version}`);
            process.exit(1);
          }
          console.log(`Playwright version: ${version}`);
          NODE

      - name: Build for Open Instrument browser smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Open Instrument browser handoff smoke
        run: npm run open-instrument:browser-smoke

      - name: Open Instrument structural readout browser smoke
        env:
          OPEN_INSTRUMENT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OPEN_INSTRUMENT_STRUCTURAL_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/open-instrument-structural-smoke
        run: npm run open-instrument:structural-browser-smoke

      - name: Upload structural browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2283-structural-browser-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/open-instrument-structural-smoke/
          if-no-files-found: warn
          retention-days: 14

  m2_solo_ai_restricted_rehearsal:
    name: m2-solo-ai-restricted-rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify hosted Docker client and daemon before rehearsal
        env:
          ZE14_ISOLATION_EVIDENCE_PATH: ${{ runner.temp }}/ze14-hosted-isolation/evidence.json
        run: |
          mkdir -p "$(dirname "$ZE14_ISOLATION_EVIDENCE_PATH")"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");
          const destination = process.env.ZE14_ISOLATION_EVIDENCE_PATH;
          let evidence;
          try {
            const versions = execFileSync("docker", ["version", "--format", "{{.Client.Version}}|{{.Server.Version}}"], { encoding: "utf8" }).trim().split("|");
            const info = execFileSync("docker", ["info", "--format", "{{.OSType}}|{{.Architecture}}|{{.Driver}}"], { encoding: "utf8" }).trim().split("|");
            if (versions.length !== 2 || !versions[0] || !versions[1] || info[0] !== "linux") {
              throw new Error("Docker client/server or Linux daemon identity was incomplete");
            }
            evidence = {
              schemaVersion: "ze14.hosted-isolation-evidence.v0.2",
              status: "PASS",
              docker: { clientVersion: versions[0], serverVersion: versions[1], osType: info[0], architecture: info[1], storageDriver: info[2] },
              classification: { PROCESS_ISOLATION: "NOT_RUN", AI_REVIEW_EXECUTED: "NOT_RUN", SYNTHETIC_REVIEW_RESULT: "UNKNOWN", REAL_M2_READINESS: "UNKNOWN" },
            };
          } catch (error) {
            evidence = {
              schemaVersion: "ze14.hosted-isolation-evidence.v0.2",
              status: "BLOCKED",
              docker: null,
              error: { name: error?.name ?? "Error", message: String(error?.message ?? error).slice(0, 500) },
              classification: { PROCESS_ISOLATION: "BLOCKED", AI_REVIEW_EXECUTED: "NOT_RUN", SYNTHETIC_REVIEW_RESULT: "UNKNOWN", REAL_M2_READINESS: "UNKNOWN" },
            };
          }
          fs.mkdirSync(path.dirname(destination), { recursive: true });
          fs.writeFileSync(destination, JSON.stringify(evidence, null, 2) + "\n", { mode: 0o600 });
          if (evidence.status !== "PASS") process.exitCode = 1;
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test hosted reviewer request and Docker configuration contracts
        run: npx jest -c jest.config.mjs tests/openInstrument.m2SoloAiHostedIsolation.v0_2.spec.ts --runInBand

      - name: Execute Docker-isolated synthetic reviewer handoff
        env:
          ZE14_DOCKER_PREFLIGHT_PATH: ${{ runner.temp }}/ze14-hosted-isolation/evidence.json
          ZE14_ISOLATION_EVIDENCE_PATH: ${{ runner.temp }}/ze14-hosted-isolation/evidence.json
        run: node scripts/openInstrument/m2SoloAiHostedIsolation.v0_2.mjs

      - name: Upload hosted isolation execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze14-hosted-isolation-${{ github.run_id }}
          path: ${{ runner.temp }}/ze14-hosted-isolation/evidence.json
          if-no-files-found: warn
          retention-days: 14

  lint-test-build:
    name: lint-test-build
    if: ${{ always() }}
    needs: [core_validation, browser_smoke, unit_tests, m2_solo_ai_restricted_rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require core and browser validation
        env:
          CORE_RESULT: ${{ needs.core_validation.result }}
          BROWSER_RESULT: ${{ needs.browser_smoke.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          ISOLATION_RESULT: ${{ needs.m2_solo_ai_restricted_rehearsal.result }}
        run: |
          set -eu
          test "$CORE_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$ISOLATION_RESULT" = "success"
          echo "Core validation: $CORE_RESULT"
          echo "Browser smoke: $BROWSER_RESULT"
          echo "Unit tests: $UNIT_RESULT"
          echo "Restricted reviewer rehearsal: $ISOLATION_RESULT"
          echo "lint-test-build aggregate: PASS"
