name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Open Instrument run packet fixture validation
        run: npm run open-instrument:validate-run-packet-fixture

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --silent

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
