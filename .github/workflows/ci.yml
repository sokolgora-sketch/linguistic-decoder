name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core_validation:
    name: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Open Instrument run packet fixture validation
        run: npm run open-instrument:validate-run-packet-fixture

      - name: Check Open Instrument analytical capability baseline reproducibility
        run: npm run open-instrument:analysis-capability-baseline -- --check

      - name: Validate Open Instrument provider execution preflight static fixture
        run: npm run open-instrument:validate-provider-execution-preflight-static-fixture

      - name: Audit provider execution preflight mapping coverage
        run: npm run open-instrument:audit-provider-execution-preflight-mapping-coverage

      - name: Test Open Instrument provider execution preflight static fixture validator
        run: npx jest -c jest.config.mjs tests/openInstrument.providerExecutionPreflightStaticFixtureSchemaValidation.v0.1.spec.ts --runInBand

      - name: Test Open Instrument provider execution preflight static fixture validator integration gate
        run: npx jest -c jest.config.mjs tests/openInstrument.providerExecutionPreflightStaticFixtureSchemaValidationIntegrationGate.v0.1.spec.ts --runInBand

      - name: Lint
        run: npm run lint

      - name: Integration
        run: npm run test:integration

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  unit_tests:
    name: unit-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test unit shard
        run: npm test -- --ci --silent --maxWorkers=2 --shard=${{ matrix.shard }}/4

  browser_smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify Playwright version alignment
        run: |
          node <<'NODE'
          const version = require("playwright/package.json").version;
          if (version !== "1.63.0") {
            console.error(`Expected Playwright 1.63.0, found ${version}`);
            process.exit(1);
          }
          console.log(`Playwright version: ${version}`);
          NODE

      - name: Build for Open Instrument browser smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Open Instrument browser handoff smoke
        run: npm run open-instrument:browser-smoke

  lint-test-build:
    name: lint-test-build
    if: ${{ always() }}
    needs: [core_validation, browser_smoke, unit_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require core and browser validation
        env:
          CORE_RESULT: ${{ needs.core_validation.result }}
          BROWSER_RESULT: ${{ needs.browser_smoke.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
        run: |
          set -eu
          test "$CORE_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          echo "Core validation: $CORE_RESULT"
          echo "Browser smoke: $BROWSER_RESULT"
          echo "lint-test-build aggregate: PASS"
