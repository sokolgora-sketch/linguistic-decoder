# Deploy to the live channel on push to main.
name: Deploy to Firebase Hosting (Live)

on:
  push:
    branches:
      - main

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write Firebase service account
        run: |
          node -e "require('fs').writeFileSync(process.env.OUT, process.env.SA_JSON)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$OUT" >> "$GITHUB_ENV"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OUT: ${{ runner.temp }}/firebase-sa.json

      - name: Install firebase-tools
        run: npm i -g firebase-tools@15.7.0

      - name: Deploy (hosting)
        run: firebase deploy --only hosting --project studio-9091923245-2991d --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
