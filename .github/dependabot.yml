version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"

    open-pull-requests-limit: 2

    groups:
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    ignore:
      # Keep this from your current file
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

      # Reduce noisy toolchain major-jump PRs
      - dependency-name: "@typescript-eslint/*"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "@testing-library/*"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "genkit-cli"
        update-types:
          - "version-update:semver-major"
